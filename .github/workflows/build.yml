name: Build Windows exe (32-bit)

# Build 32-bit (i686) vì BYKCommunication.dll của máy haze-gard i là bản 32-bit.
# Bản 32-bit chạy được cả trên Windows 64-bit và dùng được cho cả máy plus (RS232).
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Build release (32-bit)
        run: cargo build --release --target i686-pc-windows-msvc --features embed_dll

      # Test không chặn việc tạo file exe; xem kết quả trong tab Actions
      - name: Unit tests
        run: cargo test --lib --release --target i686-pc-windows-msvc --features embed_dll
        continue-on-error: true

      - name: Đặt tên file
        shell: pwsh
        run: Copy-Item target/i686-pc-windows-msvc/release/hazegard-gui.exe hazegard_gui.exe

      - uses: actions/upload-artifact@v4
        with:
          name: hazegard_gui
          path: hazegard_gui.exe
