name: Build Windows exe (32-bit)

# Build 32-bit (i686) vì BYKCommunication.dll của máy haze-gard i là bản 32-bit.
# Bản 32-bit chạy được cả trên Windows 64-bit và dùng được cho cả máy plus (RS232).
#  - Chỉ chạy khi bạn bấm: tab Actions -> "Build Windows exe (32-bit)" -> "Run workflow" (commit/push KHÔNG tự chạy).
#    File exe nằm ở mục "Artifacts" của lượt chạy.
#  - Muốn tạo Release luôn: điền ô "Tên tag" (vd v0.1.1) khi bấm Run workflow.
#  - Hoặc gắn tag dạng v0.1.1 và đẩy lên: cũng tạo Release có file exe.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tên tag để tạo Release (vd v0.1.1). Để trống nếu chỉ muốn build."
        required: false
        default: ""

permissions:
  contents: write   # cần để tạo Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Build release (32-bit)
        run: cargo build --release --target i686-pc-windows-msvc --features embed_dll

      # Test không chặn việc tạo file exe; xem kết quả trong tab Actions
      - name: Unit tests
        run: cargo test --lib --release --target i686-pc-windows-msvc --features embed_dll
        continue-on-error: true

      - name: Đặt tên file
        shell: pwsh
        run: Copy-Item target/i686-pc-windows-msvc/release/hazegard-gui.exe hazegard_gui.exe

      - uses: actions/upload-artifact@v4
        with:
          name: hazegard_gui
          path: hazegard_gui.exe

      - name: Tạo Release (khi đẩy tag v* hoặc điền tên tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: hazegard_gui.exe
          generate_release_notes: true
