name: Build Python exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # cần Windows 8.1 trở lên; máy Windows 7 phải dùng "3.8"

      - name: Cài thư viện
        run: pip install pyinstaller pyserial

      - name: Đóng gói exe
        run: pyinstaller --onefile --noconsole --name hazegard_gui hazegard_gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: hazegard_gui
          path: dist/hazegard_gui.exe
