name: Build Python exe

on:
  push:                      # chạy khi push lên BẤT KỲ nhánh nào
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hazegard-py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x86"      # bắt buộc 32-bit cho BYKCommunication.dll (máy haze-gard i)

      - name: Cài thư viện
        run: pip install pyinstaller pyserial

      - name: Đóng gói exe
        run: pyinstaller --onefile --noconsole --hidden-import hazegard_i --name hazegard_gui hazegard_gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: hazegard_gui
          path: hazegard-py/dist/hazegard_gui.exe
